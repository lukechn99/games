name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Kart racer (Godot): run its physics tests, then export it into
      # public/racing so the site build below publishes it at /racing/.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Install Godot and the web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -qj /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
      - name: Test and export the kart racer
        run: |
          ~/godot/godot --headless --path racing --import
          # A script error can stop the tests without failing the step, so
          # also insist on the final "N passed, 0 failed" line.
          ~/godot/godot --headless --path racing --fixed-fps 60 -s tests/run_tests.gd 2>&1 | tee /tmp/racing-tests.log
          grep -qE "^[0-9]+ passed, 0 failed" /tmp/racing-tests.log
          ! grep -q "SCRIPT ERROR" /tmp/racing-tests.log
          mkdir -p public/racing
          ~/godot/godot --headless --path racing --export-release "Web" "$PWD/public/racing/index.html"
          test -f public/racing/index.wasm
          cp racing/web/tilt.js racing/web/net.js public/racing/
      - run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional overrides, set under Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
          NEXT_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
          NEXT_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
          NEXT_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
          NEXT_PUBLIC_TURN_URL: ${{ vars.TURN_URL }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}
          NEXT_PUBLIC_TURN_WORKER: ${{ vars.TURN_WORKER || 'https://games-turn.lukechn99.workers.dev/' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '0x4AAAAAAF064-RNzaFM8An_' }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
