name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional overrides, set under Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
          NEXT_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
          NEXT_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
          NEXT_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
          NEXT_PUBLIC_TURN_URL: ${{ vars.TURN_URL }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}
          NEXT_PUBLIC_TURN_WORKER: ${{ vars.TURN_WORKER }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
